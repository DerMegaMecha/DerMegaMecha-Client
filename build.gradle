plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
}

version = '1.0.0'
group = 'com.dermegamecha.client'
base { archivesName = 'DerMegaMecha-Client' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true

    runs {
        client { workingDirectory project.file('run'); property 'forge.enabledGameTestNamespaces', 'dermegamecha'; mods { dermegamecha { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.enabledGameTestNamespaces', 'dermegamecha'; mods { dermegamecha { source sourceSets.main } } }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.28'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest { attributes([
        'Specification-Title': 'DerMegaMecha Client',
        'Specification-Vendor': 'DerMegaMecha',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'DerMegaMecha'
    ]) }
}
