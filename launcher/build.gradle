plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.dermegamecha.launcher'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

javafx {
    version = '21.0.6'
    modules = [ 'javafx.controls' ]
}

dependencies {
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'net.java.dev.jna:jna-platform:5.16.0'
}

application {
    mainClass = 'com.dermegamecha.launcher.LauncherApplication'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Run on a Windows x64 build host. jpackage uses WiX Toolset to create the EXE installer.
tasks.register('packageWindowsExe', Exec) {
    group = 'distribution'
    description = 'Build a Windows x64 EXE installer (requires Windows, JDK 21, and WiX Toolset).'
    dependsOn tasks.named('installDist')
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    doFirst {
        def inputDir = layout.buildDirectory.dir('install/launcher/lib').get().asFile
        def outputDir = layout.buildDirectory.dir('installer').get().asFile
        outputDir.mkdirs()
        commandLine 'jpackage', '--type', 'exe', '--name', 'DerMegaMechaLauncher', '--app-version', project.version.toString(),
                '--vendor', 'DerMegaMecha', '--description', 'Your Minecraft. Your Performance. Your Experience.',
                '--input', inputDir.absolutePath, '--main-jar', tasks.jar.archiveFile.get().asFile.name,
                '--main-class', 'com.dermegamecha.launcher.LauncherApplication', '--dest', outputDir.absolutePath,
                '--win-menu', '--win-shortcut', '--win-dir-chooser', '--win-per-user-install', '--java-options', '-Dfile.encoding=UTF-8'
    }
}
